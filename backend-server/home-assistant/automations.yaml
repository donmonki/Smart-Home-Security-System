- id: '1776327465398'
  alias: Start timer on motion detected
  description: ''
  triggers:
  - trigger: mqtt
    options:
      payload: 'PLACEHOLDER: motion detected'
      topic: 'PLACEHOLDER: motion'
  conditions: []
  actions:
  - action: timer.start
    metadata: {}
    target:
      entity_id: timer.disarmtimer
    data: {}
  mode: single
- id: '1776329076297'
  alias: Start alarm when timer finishes
  description: ''
  triggers:
  - trigger: event
    event_data:
      entity_id: timer.disarmtimer
    event_type: timer.finished
  conditions: []
  actions:
  - action: script.start_alarm
    metadata: {}
    data: {}
  mode: single
- id: '1776329076298'
  alias: RFID Card Check
  description: ''
  triggers:
  - device_id: a5f2fbe73757a645e092d19254692dc1
    domain: alarm_control_panel
    entity_id: b4a942cd82f6f0e1c954d851e895dfa3
    type: triggered
    trigger: device
  conditions: []
  actions:
  - if:
    - condition: template
      value_template: '{{ rfid_id in valid_ids }}'
    then:
    - action: timer.cancel
      metadata: {}
      target:
        entity_id: timer.disarmtimer
      data: {}
    - action: notify.notify
      metadata: {}
      data:
        message: AUTHENTICATED
        target: notify.rfid_reader_rfid_authenticated
    else:
    - action: script.start_alarm
      metadata: {}
      data: {}
  variables:
    rfid_id: '{{ trigger.payload }}'
    valid_ids:
    - 'PLACEHOLDER: valid rfid id'
  mode: single
- id: '1776895453165'
