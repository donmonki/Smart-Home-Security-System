- id: '1777998260451'
  alias: RFID Scan Handler
  description: ''
  triggers:
  - trigger: mqtt
    options:
      topic: home/nodes/3/scanned
  conditions:
  - condition: state
    entity_id: input_boolean.armed_disarmed
    state:
    - 'on'
  actions:
  - variables:
      scanned_id: '{{ trigger.payload_json.value | upper }}'
      valid_ids: '{{ states(''input_text.rfid_valid_ids'').split('','') }}'
  - action: notify.send_message
    metadata: {}
    target:
      entity_id: notify.rfid_reader_rfid_authenticated
    data:
      message: '{{ 2 if scanned_id in valid_ids else 1 }}'
  - if:
    - condition: template
      value_template: '{{ scanned_id in valid_ids }}'
    then:
    - action: input_boolean.turn_off
      metadata: {}
      target:
        entity_id: input_boolean.armed_disarmed
      data: {}
    - action: timer.cancel
      metadata: {}
      target:
        entity_id: timer.disarmtimer
      data: {}
  mode: single
- id: '1778148497275'
  alias: RFID arm system
  description: ''
  triggers:
  - trigger: mqtt
    options:
      topic: home/nodes/3/scanned
  conditions:
  - condition: state
    entity_id: input_boolean.armed_disarmed
    state:
    - 'off'
  actions:
  - variables:
      scanned_id: '{{ trigger.payload_json.value | upper }}'
      valid_ids: '{{ states(''input_text.rfid_valid_ids'').split('','') }}'
  - if:
    - condition: template
      value_template: '{{ scanned_id in valid_ids }}'
    then:
    - action: input_boolean.turn_on
      metadata: {}
      target:
        entity_id: input_boolean.armed_disarmed
      data: {}
  mode: single
