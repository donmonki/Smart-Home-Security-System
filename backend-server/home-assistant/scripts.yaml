start_alarm:
  sequence:
  - action: mqtt.publish
    metadata: {}
    data:
      evaluate_payload: false
      qos: '1'
      topic: 'PLACEHOLDER: LED'
      payload: 'PLACEHOLDER: flash red'
      retain: false
    alias: MQTT Publish LED flashing
  - alias: MQTT Publish buzzer
    action: mqtt.publish
    metadata: {}
    data:
      evaluate_payload: false
      qos: '1'
      topic: 'PLACEHOLDER: buzzer'
      payload: 'PLACEHOLDER: start'
      retain: false
  alias: Start alarm
  description: ''
